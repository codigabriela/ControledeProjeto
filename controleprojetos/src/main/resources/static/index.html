
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Projetos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f9;
        }

        h1, h2 {
            color: #243b53;
        }

        form, .projeto {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input, button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            background: #276749;
            color: white;
            border: none;
            cursor: pointer;
        }

        #mensagem {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h1>Controle de Projetos</h1>

    <h2>Cadastrar projeto</h2>

    <form id="formProjeto">
        <input type="text" id="descricao"
               placeholder="Descrição do projeto" required>

        <label>Data de início</label>
        <input type="date" id="dataInicio" required>

        <label>Data de término</label>
        <input type="date" id="dataFim" required>

        <button type="submit">Cadastrar projeto</button>
    </form>

    <p id="mensagem"></p>

    <h2>Projetos cadastrados</h2>
    <div id="listaProjetos"></div>

    <script src="script.js"></script>
</body>
</html>
